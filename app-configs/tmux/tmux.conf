set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -g allow-passthrough on
set -g set-clipboard on
set -g history-limit 20000
set -g status-style "bg=default,fg=colour7"
set -g pane-border-style "fg=#303030"
set -g pane-active-border-style "fg=#303030"
set -g message-style "bg=colour0,fg=colour7"
set -g mode-style "bg=colour0,fg=colour7"
set -g status-left "#[fg=colour4,bold] #S #[default]"
set -g status-right "#[fg=colour8] %d/%m #[fg=colour7]%H:%M "
setw -g window-status-current-format "#[fg=colour4,bold]#I:#W#[default]"
setw -g window-status-format "#[fg=colour8]#I:#W#[default]"
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "~/.local/bin/wl-copy"
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tema recarregado"
