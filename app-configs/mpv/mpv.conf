profile=sw-fast
vo=kitty
vo-kitty-use-shm=no
vo-kitty-auto-multiplexer-passthrough=yes
input-terminal=yes
osc=no
term-osd=force
term-osd-bar=yes
term-status-msg=▶ ${media-title} · ${time-pos}/${duration} · Espaço: pausar · ←/→: buscar · q: sair

# Sem memória compartilhada: quadros enviados diretamente ao terminal.
hwdec=no
